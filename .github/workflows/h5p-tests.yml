name: H5P tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moodle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, intl, soap, gd, pgsql
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install isolated Moodle 5.2 test environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE
      - name: Standalone blueprint validation tests
        run: php plugin/tests/blueprint_standalone.php
      - name: PHP syntax
        run: moodle-plugin-ci phplint
      - name: Package and native Moodle integration tests
        run: moodle-plugin-ci phpunit --fail-on-warning

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP with Moodle's required aimcp root folder
        run: |
          release=$(sed -n "s/^\$plugin->release *= *'\([^']*\)'.*/\1/p" version.php)
          test -n "$release"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          mkdir -p build/aimcp
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/aimcp/
          (cd build && zip -q -r "../local_aimcp-$release.zip" aimcp)
          unzip -Z1 "local_aimcp-$release.zip" | grep -Fx 'aimcp/version.php'
      - uses: actions/upload-artifact@v4
        with:
          name: local_aimcp-${{ env.RELEASE }}-installable
          path: local_aimcp-${{ env.RELEASE }}.zip
          if-no-files-found: error
